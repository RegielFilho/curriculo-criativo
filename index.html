<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#040A12">
  <title>REGIEL DIAS FERREIRA FILHO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --bg-dark: #040A12;
      --bg-poster: #0B1F33;
      --border-purple: #007BC0;
      --accent-cyan: #00AEEF;
      --accent-gold: #FFB547;
      --accent-green: #00A878;
      --text-main: #FFFFFF;
      --text-dim: #E2ECF5;
      --text-highlight: #72CFFF;
      --text-positive: #66D9A8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'VT323', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: .15;
      background-image: linear-gradient(90deg, #007BC0 1px, transparent 1px), linear-gradient(0deg, #007BC0 1px, transparent 1px);
      background-size: 35px 35px;
    }

    .poster-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1240px;
      aspect-ratio: 1240 / 840;
      background: radial-gradient(circle at 50% 30%, #0B1F33 0%, #07131F 65%, #040A12 100%);
      border: 3px solid var(--border-purple);
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 123, 192, .35), inset 0 0 80px rgba(0, 0, 0, .9);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .poster-viewport > svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media(max-width: 900px) {
      .poster-viewport {
        aspect-ratio: auto;
        height: auto;
        max-width: 100%;
        padding-bottom: 0;
        overflow-x: auto;
      }
      .poster-viewport > svg {
        width: 100%;
        height: auto;
        min-width: 760px;
      }
    }

    @keyframes spinChuck {
      0% { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }
    @keyframes armJoint1 {
      0%, 100% { transform: rotate(0); }
      50% { transform: rotate(-18deg); }
    }
    @keyframes armJoint2 {
      0%, 100% { transform: rotate(0); }
      50% { transform: rotate(25deg); }
    }
    @keyframes clawGrip {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }
    @keyframes pistonMove {
      0%, 100% { transform: translateY(0); }
      40%, 50% { transform: translateY(16px); }
    }
    @keyframes conveyorCrateMove {
      0% { transform: translateX(0); opacity: 0; }
      12%, 88% { opacity: 1; }
      100% { transform: translateX(65px); opacity: 0; }
    }
    @keyframes laserSweepVertical {
      0%, 100% { transform: translateY(0); opacity: .75; }
      50% { transform: translateY(16px); opacity: .95; }
    }
    @keyframes conduitPulse {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes statusPulse {
      0%, 100% { opacity: .65; }
      50% { opacity: 1; }
    }

    .anim-spin { animation: spinChuck 1.2s linear infinite; transform-box: fill-box; transform-origin: center; }
    .anim-spin-fast { animation: spinChuck .4s linear infinite; transform-box: fill-box; transform-origin: center; }
    .anim-arm-1 { animation: armJoint1 4s cubic-bezier(.45, 0, .55, 1) infinite; transform-origin: 17px 44px; }
    .anim-arm-2 { animation: armJoint2 4s cubic-bezier(.45, 0, .55, 1) infinite; transform-origin: 42px 12px; }
    .anim-claw { animation: clawGrip 4s cubic-bezier(.45, 0, .55, 1) infinite; }
    .anim-piston { animation: pistonMove 2.2s cubic-bezier(.77, 0, .175, 1) infinite; }
    .anim-crate { animation: conveyorCrateMove 3s linear infinite; }
    .anim-laser { animation: laserSweepVertical 2.2s ease-in-out infinite; }
    .conduit-line { stroke-dasharray: 8, 8; animation: conduitPulse 1.5s linear infinite; }
    .status-pulse { animation: statusPulse 1.8s ease-in-out infinite; }

    .interactive-machinery { cursor: pointer; transition: filter .2s ease; }
    .interactive-machinery:hover { filter: brightness(1.25); }
    .boosted { animation-duration: .25s !important; filter: drop-shadow(0 0 8px #FFB547) !important; }
    
    .stage-card { cursor: pointer; }
    .stage-card .card-bg { transition: stroke .25s ease, stroke-width .25s ease; }
    .stage-card:hover .card-bg { stroke: var(--accent-cyan) !important; stroke-width: 2.5px !important; }
    .stage-card .card-header-bg { transition: fill .25s ease, stroke .25s ease; }
    .stage-card:hover .card-header-bg { stroke: var(--accent-cyan) !important; }

    .modal-backdrop { background: rgba(2, 8, 15, .84); backdrop-filter: blur(8px); transition: opacity .25s ease; }
    .modal-panel {
      position: relative;
      max-height: 90vh;
      overflow: auto;
      padding: 30px 26px 22px !important;
      border: 3px solid #9AA7B3 !important;
      border-radius: 12px !important;
      background: linear-gradient(135deg, #263442 0%, #152432 100%) !important;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .65), inset 0 0 0 2px rgba(255, 255, 255, .06) !important;
    }

    .clipboard-clip {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 20px;
      border: 2px solid #8B9BAA;
      border-top: 0;
      border-radius: 0 0 8px 8px;
      background: linear-gradient(180deg, #D6E0EA, #8B9BAA);
      box-shadow: 0 3px 8px #0008;
    }

    .report-kicker {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin: 2px 0 15px;
      padding: 9px 12px;
      border: 1px solid #536778;
      border-radius: 4px;
      background: #0B1F33;
      color: var(--text-dim);
      font: 11px 'Share Tech Mono', monospace;
      letter-spacing: .08em;
    }

    .report-paper {
      position: relative;
      padding: 20px 18px 18px 24px;
      border: 1px solid #536778;
      border-radius: 4px;
      background: repeating-linear-gradient(to bottom, #102337 0, #102337 31px, #1b3549 32px, #102337 33px);
      box-shadow: inset 5px 0 0 #FFB547;
    }

    .report-paper:before {
      content: 'RELATÓRIO TÉCNICO';
      position: absolute;
      right: 12px;
      top: -10px;
      padding: 3px 8px;
      background: #FFB547;
      color: #07131F;
      font: 8px 'Press Start 2P', monospace;
      letter-spacing: .02em;
    }

    .report-paper p {
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .report-paper p:last-child {
      margin-bottom: 0;
    }

    .report-paper .report-stamp {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 10px;
      border: 1px dashed #66D9A8;
      color: #66D9A8;
      font: 11px 'Share Tech Mono', monospace;
      letter-spacing: .06em;
    }

    .modal-panel #modal-title {
      line-height: 1.8;
      max-width: calc(100% - 35px);
    }
    .modal-panel .modal-heading {
      border-bottom: 1px solid #536778 !important;
      padding: 12px 0 14px !important;
      margin: 0 0 14px !important;
    }
    .modal-panel .modal-footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px dashed #718394;
      color: #D6E0EA;
      font: 11px 'Share Tech Mono', monospace;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .no-select { user-select: none; }

    @media(max-width: 640px) {
      .modal-panel { padding: 28px 14px 16px !important; }
      .report-kicker { font-size: 10px; flex-wrap: wrap; }
      .report-paper { padding: 17px 12px 14px 17px; }
      .report-paper:before { font-size: 6px; }
    }

    @media(prefers-reduced-motion: reduce) {
      .anim-spin, .anim-spin-fast, .anim-arm-1, .anim-arm-2, .anim-claw, .anim-piston, .anim-crate, .anim-laser, .conduit-line, .status-pulse {
        animation-duration: 8s;
      }
    }

    @media print {
      @page { size: A4 landscape; margin: 0; }
      html, body { width: 297mm; height: 210mm; background: #000 !important; padding: 0 !important; margin: 0 !important; overflow: hidden !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .no-print, .bg-grid { display: none !important; }
      .poster-viewport { width: 297mm !important; height: 201mm !important; max-width: none !important; aspect-ratio: auto !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; overflow: hidden !important; margin: 4.5mm 0 0 !important; }
      .poster-viewport > svg { width: 100% !important; height: 100% !important; }
      .poster-viewport * { animation: none !important; transition: none !important; }
      .stage-card { cursor: default !important; }
    }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  
  <header class="no-print w-full max-w-[1240px] mb-3 flex flex-wrap items-center justify-between gap-2 px-3 py-2 bg-[#0B1F33] border border-[#007BC0] rounded-lg shadow-lg z-20">
    <div class="flex items-center gap-3">
      <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#00A878] status-pulse"></span>
      <h1 class="text-[#FFFFFF] font-['Press_Start_2P'] text-[10px] sm:text-xs tracking-wider">REGIEL DIAS</h1>
    </div>
    <div class="flex items-center gap-2 font-['Share_Tech_Mono'] text-xs">
      <button id="anim-toggle-btn" onclick="toggleAnimations()" class="px-2.5 py-1.5 bg-[#07131F] hover:bg-[#0B1F33] text-[#FFFFFF] border border-[#FFFFFF] rounded transition">⚡ ANIM</button>
      <button onclick="window.print()" class="px-3 py-1.5 bg-[#FFFFFF] hover:bg-[#E0E0E0] text-[#07131F] font-bold font-['Press_Start_2P'] text-[9px] rounded shadow-md transition transform active:scale-95">🖨️ PDF / IMPRIMIR</button>
    </div>
  </header>

  <main class="poster-viewport p-2 sm:p-4">
    <svg viewBox="0 0 1240 840" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Currículo interativo de Regiel Dias Ferreira Filho">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10Z" fill="#00AEEF"/>
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10Z" fill="#00A878"/>
        </marker>

        <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0B1F33" stop-opacity=".96"/>
          <stop offset="100%" stop-color="#07131F" stop-opacity=".99"/>
        </linearGradient>
        <linearGradient id="grad-laser-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#00AEEF" stop-opacity=".85"/>
          <stop offset="100%" stop-color="#00AEEF" stop-opacity=".02"/>
        </linearGradient>
        <linearGradient id="grad-laser-blue" x1="0%" y1="0%" x2="0%" y2="100%">

          <stop offset="100%" stop-color="#007BC0" stop-opacity=".02"/>
        </linearGradient>
        <linearGradient id="grad-laser-gold" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFB547" stop-opacity=".85"/>
          <stop offset="100%" stop-color="#FFB547" stop-opacity=".02"/>
        </linearGradient>
      </defs>

      <!-- Cabeçalho / telemetria -->
      <g transform="translate(30,20)">
        <rect x="0" y="0" width="670" height="65" rx="6" fill="url(#grad-card)" stroke="#FFB547" stroke-width="2.5"/>
        <text x="20" y="27" fill="#FFFFFF" font-family="'Press Start 2P'" font-size="13" letter-spacing="1">REGIEL DIAS FERREIRA FILHO</text>
        <text x="20" y="50" fill="#72CFFF" font-family="'Share Tech Mono'" font-size="14">ENGENHARIA DE SOFTWARE &amp; TÉCNICO EM MECATRÔNICA</text>
        
        <rect x="685" y="0" width="495" height="65" rx="6" fill="url(#grad-card)" stroke="#00AEEF" stroke-width="2"/>
        <text x="700" y="22" fill="#FFB547" font-family="'Press Start 2P'" font-size="8">PAINEL DE CONTROLE // CURRÍCULO</text>
        <text x="700" y="42" fill="#FFFFFF" font-family="'Share Tech Mono'" font-size="13">IDADE: <tspan fill="#66D9A8" font-weight="bold">18 ANOS</tspan> | FOCO: <tspan fill="#66D9A8" font-weight="bold">MECATRÔNICA</tspan></text>
        <text x="700" y="57" fill="#E2ECF5" font-family="'Share Tech Mono'" font-size="12">STATUS: <tspan fill="#66D9A8">EM DESENVOLVIMENTO CONTÍNUO</tspan></text>
      </g>

      <!-- Linhas de fluxo da fábrica -->
      <g stroke="#00AEEF" stroke-width="3" fill="none" opacity=".9">
        <path d="M570 245H630" class="conduit-line" marker-end="url(#arrow)"/>
        <path d="M895 390V420H305V455" class="conduit-line" marker-end="url(#arrow)"/>
        <path d="M570 610H630" class="conduit-line" marker-end="url(#arrow)"/>
      </g>

      <!-- ETAPA 1 -->
      <g transform="translate(30,105)" class="stage-card" onclick="openModal(1)" tabindex="0" role="button" aria-label="Abrir detalhes das experiências profissionais">

        <rect x="10" y="10" width="520" height="28" rx="4" fill="#07131F" stroke="#FFB547" stroke-width="1" class="card-header-bg"/>
        
        <g transform="translate(20,44)" class="interactive-machinery" onclick="event.stopPropagation();triggerAnimationBoost(this,'gear')">
          <rect x="0" y="18" width="55" height="52" rx="5" fill="#0B1F33" stroke="#00AEEF" stroke-width="2"/>
          <rect x="30" y="26" width="20" height="18" fill="#00AEEF" opacity=".8"/>
          <g class="anim-spin"><circle cx="18" cy="70" r="9" fill="#8B9BAA" stroke="#FFB547" stroke-width="2"/><line x1="18" y1="61" x2="18" y2="79" stroke="#FFB547" stroke-width="1.5"/></g>
          <g class="anim-spin"><circle cx="42" cy="70" r="9" fill="#8B9BAA" stroke="#FFB547" stroke-width="2"/><line x1="42" y1="61" x2="42" y2="79" stroke="#FFB547" stroke-width="1.5"/></g>
          <rect x="60" y="8" width="130" height="62" rx="4" fill="#0B1F33" stroke="#FFB547" stroke-width="2"/>
          <text x="125" y="38" fill="#FFB547" font-family="'VT323'" font-size="18" text-anchor="middle">CARGA DE VIVÊNCIAS</text>
          <g class="anim-spin"><circle cx="95" cy="70" r="9" fill="#8B9BAA" stroke="#FFB547" stroke-width="2"/><line x1="95" y1="61" x2="95" y2="79" stroke="#FFB547" stroke-width="1.5"/></g>
          <g class="anim-spin"><circle cx="155" cy="70" r="9" fill="#8B9BAA" stroke="#FFB547" stroke-width="2"/><line x1="155" y1="61" x2="155" y2="79" stroke="#FFB547" stroke-width="1.5"/></g>
          <rect x="195" y="58" width="305" height="14" fill="#8B9BAA" stroke="#00AEEF" stroke-width="1"/>
          <line x1="220" y1="58" x2="220" y2="40" stroke="#FFB547" stroke-width="2"/>

          <text x="220" y="39" fill="#07131F" font-family="'VT323'" font-size="11" text-anchor="middle">BOX</text>
        </g>
        
        <g transform="translate(20,130)">
          <text x="0" y="15" fill="#FFB547" font-family="'VT323'" font-size="17">• AUXILIAR ADMINISTRATIVO // ATUAL:</text>
          <text x="15" y="30" fill="#FFFFFF" font-family="'VT323'" font-size="14.5">↳ Empresa familiar de colchões: rotinas administrativas.</text>
          <text x="0" y="52" fill="#FFB547" font-family="'VT323'" font-size="17">• EXPERIÊNCIAS ANTERIORES:</text>
          <text x="15" y="67" fill="#FFFFFF" font-family="'VT323'" font-size="14.5">↳ Açougue, barbearia e construção civil (servente).</text>
          <text x="0" y="89" fill="#FFB547" font-family="'VT323'" font-size="17">• APRENDIZADOS DO TRABALHO:</text>
          <text x="15" y="104" fill="#FFFFFF" font-family="'VT323'" font-size="14.5">↳ Adaptação, responsabilidade e dedicação.</text>

      </g>

      <!-- ETAPA 2 -->
      <g transform="translate(630,105)" class="stage-card" onclick="openModal(2)" tabindex="0" role="button" aria-label="Abrir detalhes da formação e conhecimentos">

        <rect x="10" y="10" width="520" height="28" rx="4" fill="#07131F" stroke="#00AEEF" stroke-width="1" class="card-header-bg"/>
        
        <g transform="translate(20,44)">
          <g transform="translate(5,0)" class="interactive-machinery" onclick="event.stopPropagation();triggerAnimationBoost(this,'cnctorno')">

            <circle cx="15" cy="50" r="4" fill="#00A878"/>
            <circle cx="57" cy="50" r="4" fill="#00A878"/>

            <g class="anim-crate">
              <rect x="10" y="22" width="36" height="20" rx="3" fill="#07131F" stroke="#00A878" stroke-width="1.5"/>

            </g>
          </g>
        </g>
        
        <g transform="translate(20,130)">
          <text x="0" y="15" fill="#00AEEF" font-family="'VT323'" font-size="17">• TÉCNICO EM MECATRÔNICA // SENAI CIC:</text>
          <text x="15" y="30" fill="#FFFFFF" font-family="'VT323'" font-size="14.5">↳ Formação técnica em andamento; sistemas e automação.</text>
          <text x="0" y="52" fill="#00AEEF" font-family="'VT323'" font-size="17">• ENGENHARIA DE SOFTWARE // UNICESUMAR:</text>
          <text x="15" y="67" fill="#FFFFFF" font-family="'VT323'" font-size="14.5">↳ Graduação em andamento; programação e sistemas.</text>
          <text x="0" y="89" fill="#00AEEF" font-family="'VT323'" font-size="17">• DESENVOLVIMENTO WEB E SISTEMAS:</text>
          <text x="15" y="104" fill="#FFFFFF" font-family="'VT323'" font-size="14.5">↳ Prática com HTML, CSS, JS, Git/GitHub, AI, CLP e Eletrônica.</text>
        </g>
        <text x="270" y="24" fill="#00AEEF" font-family="'Press Start 2P'" font-size="7.5" text-anchor="middle" dominant-baseline="middle">ETAPA 2: MÁQUINAS // FORMAÇÃO [CLIQUE]</text>
      </g>

  <!-- Modal de detalhes -->
  <div id="modal-container" class="no-print fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop opacity-0 pointer-events-none" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="if(event.target===this)closeModal()">
    <div class="modal-panel relative w-full max-w-2xl text-[#FFFFFF] transform scale-95 transition-all duration-300">
      <div class="clipboard-clip" aria-hidden="true"></div>
      <div class="modal-heading flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#00AEEF]"></span>
          <h3 id="modal-title" class="font-['Press_Start_2P'] text-xs text-[#FFB547]">RELATÓRIO DA ETAPA</h3>
        </div>
        <button onclick="closeModal()" aria-label="Fechar janela" class="text-[#E2ECF5] hover:text-[#FFFFFF] text-2xl font-bold px-2 py-1 transition" title="Fechar">✕</button>
      </div>
      <div class="report-kicker">

      </div>

  <script>
    let animationsActive = true;

    function triggerAnimationBoost(element, type) {
      element.classList.add('boosted');
      setTimeout(() => element.classList.remove('boosted'), 600);
      const messages = {
        gear: 'Engrenagens da doca em ciclo turbo.',
        cnctorno: 'Torno CNC acionado em velocidade máxima de animação.',
        robot: 'Braço robótico executando rotina de precisão.',
        press: 'Prensa pneumática em ciclo de demonstração.',
        conveyor: 'Esteira transportadora acelerada.',
        scanner: 'Varredura de inspeção intensificada.',
        truck: 'Rota de expedição para a próxima missão selecionada.'
      };
      if (messages[type]) console.log('[SISTEMA]', messages[type]);
    }

    function toggleAnimations() {
      animationsActive = !animationsActive;
      const btn = document.getElementById('anim-toggle-btn');
      const elements = document.querySelectorAll('.poster-viewport *');
      if (!animationsActive) {
        btn.innerText = '⚡ PAUSADO';
        btn.style.borderColor = '#E2ECF5';
        btn.style.color = '#E2ECF5';
        elements.forEach(el => el.style.animationPlayState = 'paused');
      } else {
        btn.innerText = '⚡ ANIM';
        btn.style.borderColor = '#FFFFFF';
        btn.style.color = '#FFFFFF';
        elements.forEach(el => el.style.animationPlayState = 'running');
      }
    }

    const stageDetails = {
      1: {
        title: 'ETAPA 1: DOCA // VIVÊNCIAS',
        color: '#FFB547',
        html: `<p class="text-[#FFB547] text-xl font-bold mb-2">MATÉRIA-PRIMA: EXPERIÊNCIAS DE TRABALHO</p><div class="bg-[#07131F] p-3 rounded border border-[#FFB547]/30 space-y-2"><p><strong class="text-[#FFB547]">• Auxiliar administrativo:</strong> atuação atual na empresa familiar de colchões.</p><p><strong class="text-[#FFB547]">• Experiências anteriores:</strong> açougue, barbearia e construção civil como servente.</p><p><strong class="text-[#FFB547]">• Aprendizados:</strong> adaptação a diferentes ambientes, responsabilidade e dedicação.</p></div><div class="mt-3 p-2 bg-[#07131F] border border-[#FFB547] rounded text-[#FFB547]">OBJETIVO: transformar vivências em aprendizado para os próximos desafios.</div>`
      },
      2: {
        title: 'ETAPA 2: MÁQUINAS // FORMAÇÃO',
        color: '#00AEEF',
        html: `<p class="text-[#00AEEF] text-xl font-bold mb-2">MÓDULOS DE CONHECIMENTO EM DESENVOLVIMENTO</p><div class="bg-[#07131F] p-3 rounded border border-[#00AEEF]/30 space-y-2"><p><strong class="text-[#00AEEF]">• Técnico em Mecatrônica — SENAI CIC:</strong> formação técnica em andamento.</p><p><strong class="text-[#00AEEF]">• Engenharia de Software — UniCesumar:</strong> graduação em andamento.</p><p><strong class="text-[#00AEEF]">• Desenvolvimento Web:</strong> conhecimentos práticos aplicados em HTML, CSS, SVG e JavaScript.</p></div><div class="mt-3 p-2 bg-[#07131F] border border-[#00AEEF] rounded text-[#00AEEF]">IDEIA CENTRAL: conectar sistemas físicos, tecnologia e programação.</div>`
      },
      3: {
        title: 'ETAPA 3: SCANNER // COMPETÊNCIAS',
        color: '#00AEEF',
        html: `<p class="text-[#72CFFF] text-xl font-bold mb-2">CARACTERÍSTICAS QUE BUSCO DESENVOLVER</p><div class="bg-[#07131F] p-3 rounded border border-[#00AEEF]/30 space-y-2"><p><strong class="text-[#72CFFF]">• Adaptação e versatilidade:</strong> vivências em diferentes ambientes de trabalho e estudos em duas áreas complementares.</p><p><strong class="text-[#72CFFF]">• Raciocínio e resolução de problemas:</strong> interesse em compreender como sistemas funcionam e encontrar soluções.</p><p><strong class="text-[#72CFFF]">• Aprendizado contínuo:</strong> disposição para aprender, praticar e evoluir tecnicamente.</p></div><div class="mt-3 p-2 bg-[#07131F] border border-[#00AEEF] rounded text-[#FFFFFF]">INSPEÇÃO: competências em desenvolvimento, a serem fortalecidas com experiência prática.</div>`
      },
      4: {
        title: 'ETAPA 4: EXPEDIÇÃO // PRÓXIMA MISSÃO',
        color: '#66D9A8',
        html: `<p class="text-[#66D9A8] text-xl font-bold mb-2">PRÓXIMO DESTINO PROFISSIONAL</p><div class="bg-[#07131F] p-3 rounded border border-[#66D9A8]/30 space-y-2"><p><strong class="text-[#66D9A8]">• Objetivo:</strong> ingressar na aprendizagem em Mecatrônica de Manutenção.</p><p><strong class="text-[#66D9A8]">• Contribuição que busco oferecer:</strong> curiosidade, iniciativa e interesse em conectar tecnologia e sistemas físicos.</p><p><strong class="text-[#66D9A8]">• Visão de futuro:</strong> aprender na prática e contribuir para a melhoria de processos.</p></div><div class="mt-3 p-2 bg-[#07131F] border border-[#66D9A8] rounded text-[#66D9A8]">PRÓXIMA ETAPA: transformar formação e iniciativa em experiência profissional.</div>`
      }
    };

    function openModal(stageNum) {
      const data = stageDetails[stageNum];
      if (!data) return;
      const modal = document.getElementById('modal-container');
      const panel = modal.querySelector('.modal-panel');
      document.getElementById('modal-title').innerText = data.title;
      document.getElementById('modal-title').style.color = data.color;
      document.getElementById('report-number').innerText = 'RELATÓRIO Nº 00' + stageNum;
      document.getElementById('modal-body').innerHTML = data.html + `<div class="report-stamp">REGISTRO ANALISADO · ETAPA ` + stageNum + `/4</div>`;
      modal.classList.remove('opacity-0', 'pointer-events-none');
      panel.classList.remove('scale-95');
      panel.classList.add('scale-100');
    }

    function closeModal() {
      const modal = document.getElementById('modal-container');
      const panel = modal.querySelector('.modal-panel');
      if (modal.classList.contains('pointer-events-none')) return;
      modal.classList.add('opacity-0', 'pointer-events-none');
      panel.classList.remove('scale-100');
      panel.classList.add('scale-95');
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('stage-card')) {
        e.preventDefault();
        const match = e.target.getAttribute('aria-label') || '';
        const n = match.includes('experiências') ? 1 : match.includes('formação') ? 2 : match.includes('competências') ? 3 : 4;
        openModal(n);
      }
    });
  </script>
